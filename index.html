<style>
/* palette: the grey-green of a lab notebook's ruled paper, with rust ink as the one accent */
:root{--bg:#edf1ee;--panel:#fbfcfb;--ink:#171c19;--muted:#5d6962;--line:#d8dfda;--acc:#b4460f;--acc-bg:#f8e4d4;--ok:#2f7d4f;--pdf:#dde4df;--web:#2a6a9c;--vid:#b3261e;--sh:none;color-scheme:light}
[data-theme=dark]{--bg:#0f1412;--panel:#161c19;--ink:#e4eae6;--muted:#8c9991;--line:#29322d;--acc:#f08a4b;--acc-bg:#3a2415;--ok:#6cc08c;--pdf:#090c0a;--web:#7fb6e0;--vid:#f2857c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:78px minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden;transition:background .2s,color .2s}
h1,h2,h3,h4,.q{font-family:Newsreader,"Iowan Old Style",Georgia,serif;margin:.2em 0 .4em;line-height:1.2}
h1{font-size:30px;letter-spacing:-.4px}
a{color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.45em .9em;cursor:pointer;min-height:36px;text-decoration:none;color:inherit;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s var(--e)}
button:hover,.btn:hover{border-color:var(--acc)} button:active{transform:scale(.97)}
button.pri{background:#b4460f;border:0;color:#fff;font-weight:600} button.pri:hover{background:#c5521a}
button:disabled{opacity:.5;cursor:wait}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.55em .75em}
select{width:auto}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.muted{color:var(--muted)} .row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center} .sp{flex:1}
code{background:var(--line);padding:0 .3em;border-radius:4px;font-size:.9em}
blockquote{margin:.3em 0;padding:.2em .8em;border-left:3px solid var(--acc);color:var(--muted);font-size:13.5px}
b.h{display:block;font:700 18px Newsreader,Georgia,serif;margin:.9em 0 .3em} b.h:first-child{margin-top:0}
.pl{display:block;margin:.35em 0} .gap{display:block;height:.35em}
ul,ol{padding-left:1.3em;margin:.4em 0} li{margin:.25em 0} hr{border:0;border-top:1px solid var(--line);margin:1em 0}
/* motion: one easing curve, transform and opacity only. Entrances play after navigation (.in, set by enter()), never on re-renders caused by typing or saving. */
:root{--e:cubic-bezier(.22,1,.36,1);interpolate-size:allow-keywords}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.97)}}
@keyframes fill{from{--p:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
@keyframes vtout{to{opacity:0}} @keyframes vtin{from{opacity:0}}
.in>.wrap>*,#body.in>*,#doc.in>article,#doc.in>.vid,.in :is(.grid,.rows,.tiles)>*,.fxin{animation:rise .45s var(--e) backwards}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(2),#body.in>:nth-child(2){animation-delay:35ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(3),#body.in>:nth-child(3){animation-delay:70ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(4),#body.in>:nth-child(4){animation-delay:105ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(5),#body.in>:nth-child(5){animation-delay:140ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(6),#body.in>:nth-child(6){animation-delay:175ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(7),#body.in>:nth-child(7){animation-delay:210ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(n+8),#body.in>:nth-child(n+8){animation-delay:245ms}
.in .ring{animation:fill .9s var(--e) .15s backwards}
.in .bar i{transform-origin:left;animation:grow .8s var(--e) .2s backwards}
::view-transition-old(root){animation:vtout .12s ease-in both} ::view-transition-new(root){animation:vtin .22s ease-out both}
details::details-content{block-size:0;overflow:clip;transition:block-size .3s var(--e),content-visibility .3s allow-discrete} details[open]::details-content{block-size:auto}
.sk{display:block;height:13px;border-radius:7px;margin:11px 0;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 45%,var(--panel)) 40%,var(--line) 60%) 0/300% 100%;animation:shim 1.6s linear infinite}
h1,h2,h3,h4{text-wrap:balance}
kbd{font:600 11px "Schibsted Grotesk",system-ui;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:7px;opacity:.55}
@media (hover:none){kbd{display:none}}
@media (prefers-reduced-motion:reduce){*,::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}}
.cover{--h:20;height:112px;border-radius:4px;margin:-5px -5px 2px;background:linear-gradient(135deg,hsl(var(--h) 60% 90%),hsl(calc(var(--h) + 45) 55% 80%)) center/cover;display:grid;place-items:center;color:hsl(var(--h) 45% 38%);position:relative}
[data-theme=dark] .cover{background-image:linear-gradient(135deg,hsl(var(--h) 35% 24%),hsl(calc(var(--h) + 45) 40% 15%));color:hsl(var(--h) 55% 72%)}
.cover .kind{position:absolute;left:8px;top:8px;background:var(--panel);padding:3px 9px;border-radius:99px;box-shadow:var(--sh)} .cover .ring{position:absolute;right:8px;top:8px;box-shadow:var(--sh)}
.cover.shot::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(#0000 40%,#0006)}
.step{font-weight:600;color:var(--acc)}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.tldr{font:600 18px/1.5 Newsreader,Georgia,serif;background:var(--acc-bg);border-radius:4px;padding:14px 16px;margin:14px 0}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 14px 12px;margin:10px 0;box-shadow:var(--sh)} .fact .k{margin-top:12px} .fact.key{border-color:var(--acc)}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px} .term{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 11px;font-size:13.5px;line-height:1.45} .term b{display:block;margin-bottom:2px}
#prog{height:3px;background:var(--line);flex:none} #prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .1s}
.wrap.narrow .box{padding:26px 28px} .wrap.narrow .q{font-size:25px;margin:.5em 0 .7em} .wrap.narrow .box button{min-width:92px}
/* rail */
#rail{view-transition-name:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;overflow:hidden auto;scrollbar-width:none}
.logo{width:40px;height:40px;border-radius:4px;background:linear-gradient(160deg,#d65f1f,#9c3a0a);color:#fff;font:700 24px Newsreader,Georgia,serif;display:grid;place-items:center;margin-bottom:10px;flex:none}
#nav{display:contents}
#rail button{border:0;background:none;width:100%;padding:8px 0 6px;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:4px;position:relative;min-height:0;flex:none}
#rail button:hover{color:var(--ink);background:var(--bg)} #rail button.on{background:var(--acc-bg);color:var(--acc)}
#rail .n{position:absolute;top:2px;right:8px;background:var(--acc);color:#fff;border-radius:99px;font-size:10px;line-height:16px;padding:0 5px}
[data-theme=dark] #rail .n{color:#1b1916}
/* pages */
#page{overflow:auto;min-width:0}
.wrap{max-width:1060px;margin:0 auto;padding:36px 28px 90px} .wrap.narrow{max-width:680px} .wrap.wide{max-width:1500px}
.hero{font-size:40px;margin:0} .lead{font-size:16.5px;margin:.2em 0 1.4em}
.addbar{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;box-shadow:var(--sh);margin:0 0 22px}
.addbar input{border:0;background:none;font-size:15.5px;min-width:0} .addbar input:focus-visible{outline:0} .addbar:focus-within{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:var(--sh);text-align:left;white-space:normal;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tile b{font:700 34px/1 Newsreader,Georgia,serif;margin-bottom:6px} .tile small{color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(12,1fr);grid-auto-flow:column;gap:3px;margin-top:8px;width:100%;max-width:190px}
.heat i{border-radius:3px;aspect-ratio:1;background:color-mix(in srgb,var(--ok) calc(var(--a)*100%),var(--line))}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px} .sec h3{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card h4{font-size:16.5px;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
button.card{text-align:left;white-space:normal;align-items:flex-start;gap:6px;padding:16px}
.card.flat{cursor:default} .card.flat:hover{transform:none;border-color:var(--line)}
.rows{display:flex;flex-direction:column;gap:8px}
.rows .card{flex-direction:row;align-items:center;gap:12px;padding:10px 14px} .rows .card:hover{transform:none}
.grow{flex:1;min-width:0} .grow b{font-weight:600}
.kind{display:inline-flex;gap:5px;align-items:center;font:700 11px "Schibsted Grotesk",system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--acc)} .kind.web{color:var(--web)} .kind.video{color:var(--vid)}
.tag{font:600 11px "Schibsted Grotesk",system-ui;background:var(--acc-bg);color:var(--acc);border-radius:99px;padding:2px 9px;cursor:pointer;white-space:nowrap;display:inline-block}
.tag.proj{background:none;border:1px solid var(--line);color:var(--muted)} .tag.ok{background:none;border:1px solid var(--ok);color:var(--ok);cursor:default}
.chip{border-radius:99px;min-height:32px;padding:.2em .9em;font-size:13.5px} .chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
.filters{margin:0 0 14px} .filters #q{flex:1;min-width:220px;width:auto}
.x{border:0;background:none;padding:0 6px;min-height:0;color:var(--muted)}
mark{background:#ffd60070;color:inherit;border-radius:2px}
.ring{--p:0;--in:var(--panel);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 11px "Schibsted Grotesk",system-ui;flex:none;
  background:radial-gradient(closest-side,var(--in) 74%,transparent 76%),conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.clamp{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mxwrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel);box-shadow:var(--sh);max-height:calc(100vh - 200px)}
.mx{border-collapse:separate;border-spacing:0;font-size:13.5px;line-height:1.5;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:12px 14px;vertical-align:top;text-align:left;min-width:230px;max-width:360px}
.mx tr:last-child td{border-bottom:0} .mx th{cursor:pointer;white-space:nowrap} .mx th small{color:var(--muted)}
.mx th button{min-height:0;padding:1px 6px;margin-left:6px;font:500 10px "IBM Plex Mono",monospace;color:var(--muted)}
.cell{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer} tr.open .cell{display:block}
.mx td textarea{min-height:2.4em;field-sizing:content;resize:none;background:none;border-color:transparent;padding:4px 6px;margin:-4px -6px;width:calc(100% + 12px)}
.mx td textarea:hover,.mx td textarea:focus{border-color:var(--line);background:var(--bg)}
/* filters shared by the matrix and the map */
.fbar,.cols{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.fbar input[type=search]{flex:1;min-width:200px;width:auto} .fbar input[type=number]{width:84px}
.cols{font-size:13px;gap:6px} .cols form{display:flex;gap:6px;margin-left:8px} .cols form input{width:220px;padding:.3em .7em} .cols form button{min-height:32px;padding:.2em .8em}
.runhead{display:flex;justify-content:space-between;gap:12px;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:26px}
.k,.kind,.mx th,kbd{font-family:"IBM Plex Mono",monospace!important}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px} .mapgrid #node{margin:0;overflow:auto;max-height:calc(100vh - 290px)} .mapgrid #node h3{font-size:19px}
.pickbar{padding:8px 12px;border:1px solid var(--acc);border-radius:4px;background:var(--acc-bg);margin-bottom:8px}
.card input[type=checkbox],.mx input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--acc)}
/* notebook: a list of pages, a page of blocks, and a bench that works across the page's sources */
.nb{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.nbside{padding:12px 8px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);font-size:14px}
.nbside .lbl{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 4px}
.nbside #nbq{border:0;background:none;padding:6px 10px;font-size:14px} .nbside #nbq:focus-visible{outline:0;background:var(--bg)}
.prow{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 10px;border-radius:4px;cursor:pointer;color:var(--muted);font-weight:500}
.prow:hover{background:var(--bg)} .prow.on{background:var(--bg);color:var(--ink);font-weight:600}
.prow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .prow .ico{width:18px;text-align:center;flex:none}
.prow .x{opacity:0} .prow:hover .x,.prow .x:focus-visible{opacity:1}
.nbmain{overflow:auto;display:flex;flex-direction:column;min-height:0}
.nbtop{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:4px;min-height:44px;padding:0 14px;font-size:13.5px;color:var(--muted);background:var(--bg)}
.nbtop button{border:0;background:none;min-height:28px;padding:2px 8px;font-size:13.5px;color:var(--muted)} .nbtop button:hover{background:var(--line);color:var(--ink)}
.nbpage{max-width:790px;width:100%;margin:0 auto;padding:36px 60px 0;flex:1}
.pico{font-size:62px;line-height:1.1;background:none;border:0;padding:2px 6px;min-height:0;margin:0 0 4px -8px} .pico:hover{background:var(--line)}
.addico{border:0;background:none;color:var(--muted);font-size:13.5px;padding:2px 6px;min-height:0;margin-left:-6px;opacity:0;transition:opacity .15s} .nbpage:hover .addico,.addico:focus-visible{opacity:1} .addico:hover{background:var(--line)}
.icons{display:grid;grid-template-columns:repeat(8,34px);gap:2px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);width:max-content;margin-bottom:8px;animation:pop .16s var(--e)}
.icons button{border:0;background:none;min-height:0;height:34px;padding:0;font-size:20px} .icons button:hover{background:var(--line)} .icons button:last-child{grid-column:span 8;font-size:13px;color:var(--muted)}
.props{margin:8px 0 14px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.prop{display:flex;align-items:flex-start;min-height:34px} .prop>span{width:140px;flex:none;color:var(--muted);display:flex;gap:8px;align-items:center;padding:7px 0}
.prop>div{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px;min-width:0}
.prop input{border:0;background:none;padding:6px 8px;font-size:14px;border-radius:4px} .prop input:hover,.prop input:focus{background:var(--line)} .prop input:focus-visible{outline:0}
.prop .add{border:0;background:none;color:var(--muted);min-height:28px;padding:2px 8px;font-size:14px} .prop .add:hover{background:var(--line);color:var(--ink)}
.srcchip{display:inline-flex;gap:6px;align-items:center;border-radius:4px;padding:3px 2px 3px 8px;background:var(--line);max-width:260px;color:var(--ink)}
.srcchip a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:inherit} .srcchip a:hover{color:var(--acc)}
/* the ask bar floats at the foot of the page; its ready-made requests appear while it has focus */
.askbar{position:sticky;bottom:16px;z-index:5;width:min(640px,calc(100% - 40px));margin:20px auto 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 34px #0003;padding:5px}
.askbar form{display:flex;gap:6px;align-items:center;padding-left:10px;color:var(--acc)} .askbar input{border:0;background:none;padding:.5em .3em} .askbar input:focus-visible{outline:0} .askbar form button{border-radius:7px}
.askbar .acts{display:none;flex-wrap:wrap;gap:6px;padding:8px 6px 9px;border-bottom:1px solid var(--line);margin-bottom:5px} .askbar:focus-within .acts{display:flex}
.toc{position:sticky;top:64px;height:0;align-self:flex-end;width:190px;margin-right:16px;font-size:12.5px;display:none} .toc a{display:block;padding:3px 0;color:var(--muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .toc a:hover{color:var(--acc)} .toc .l3{padding-left:12px} .toc .l4{padding-left:24px}

const dayKey = t => new Date(t).toDateString();
function streak() {
  const days = new Set(activity.map(dayKey)); let n = 0, t = Date.now();
  if (!days.has(dayKey(t))) t -= 864e5; // today doesn't break a streak until it's over
  while (days.has(dayKey(t))) { n++; t -= 864e5; }
  return n;
}
function heat() {
  const c = {}; for (const t of activity) c[dayKey(t)] = (c[dayKey(t)] || 0) + 1;
  return `<div class="heat">` + Array.from({ length: 84 }, (_, i) => {
    const d = Date.now() - (83 - i) * 864e5, n = c[dayKey(d)] || 0;
    return `<i style="--a:${n ? Math.min(1, .3 + n / 12) : 0}" title="${esc(new Date(d).toLocaleDateString())}: ${n} study step${n === 1 ? '' : 's'}"></i>`;
  }).join('') + `</div>`;
}

};

function drawMap(ps, all) {
  const nodes = new Map(), edges = [], css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  for (const p of ps) {
    if (!p.concepts.length) continue;
    if (all) nodes.set('src:' + p.id, { id: 'src:' + p.id, label: p.title.length > 46 ? p.title.slice(0, 44) + '…' : p.title, src: p.id, kind: p.kind, year: yearOf(p), w: 26 });
    for (const c of p.concepts) {
      const n = nodes.get(ckey(c.name)) || { id: ckey(c.name), label: c.name, def: c.def, in: [] };
      if (!n.in.includes(p.id)) n.in.push(p.id); nodes.set(n.id, n);
    }
  }
  const sharedOnly = all && (M.shared ?? ps.filter(p => p.concepts.length).length > 6);
  for (const n of [...nodes.values()]) {
    if (n.src) continue;

    n.w = all ? Math.min(46, 10 + 8 * n.in.length) : 16; n.many = !all || n.in.length > 1 ? 1 : 0;

  const srcs = [...nodes.values()].filter(n => n.src).sort((a, b) => a.year - b.year), nc = nodes.size - srcs.length;
  if ($('#mapn')) $('#mapn').textContent = srcs.length ? `${srcs.length} source${srcs.length === 1 ? '' : 's'} · ${nc} concept${nc === 1 ? '' : 's'}` : 'No analyzed sources match these filters.';
  // "By year" lays sources out left to right in time, one column per year, with each concept hanging between the sources that use it.
  const box = $('#cy'), big = Math.max(1, Math.sqrt(nodes.size / 30)); // the layout fills the panel's own shape, growing with the number of nodes so labels stay readable
  let layout = { name: 'cose', animate: nodes.size < 150 ? 'end' : false, animationDuration: 450, nodeRepulsion: () => 9000, idealEdgeLength: () => 80, nodeOverlap: 20, padding: 30, nodeDimensionsIncludeLabels: true,
    boundingBox: { x1: 0, y1: 0, w: box.clientWidth * big, h: box.clientHeight * big } };
  if (all && M.by === 'year') {
    const years = [...new Set(srcs.map(n => n.year))], row = {}, pos = {};
    for (const n of srcs) pos[n.id] = { x: years.indexOf(n.year) * 480, y: (row[n.year] = (row[n.year] ?? -1) + 1) * 440 };
    const own = {}, seat = {}; let mid = 0; // a source's own concepts sit in a ring around it; shared ones sit between their sources
    for (const n of nodes.values()) if (!n.src && n.in.length === 1) own[n.in[0]] = (own[n.in[0]] || 0) + 1;
    for (const n of nodes.values()) if (!n.src) {

      if (at.length > 1) { pos[n.id] = { x: avg('x'), y: avg('y') + 70 * mid++ }; continue; }
      const k = seat[n.in[0]] = (seat[n.in[0]] ?? -1) + 1, a = k / own[n.in[0]] * 2 * Math.PI, r = 135 + (k % 2) * 55;
      pos[n.id] = { x: at[0].x + r * Math.cos(a), y: at[0].y + r * Math.sin(a) };
    }

    layout = { name: 'preset', positions: n => pos[n.id()], padding: 30 };
  }

  cy = cytoscape({
    container: $('#cy'), layout, minZoom: .15, maxZoom: 3, wheelSensitivity: .3,
    elements: [...[...nodes.values()].map(data => ({ data })), ...edges.map(data => ({ data }))],
    style: [
      { selector: 'node', style: { label: 'data(label)', 'font-family': 'Schibsted Grotesk, sans-serif', 'font-size': 11, color: css('--ink'), 'background-color': css('--muted'), width: 'data(w)', height: 'data(w)', 'text-wrap': 'wrap', 'text-max-width': 110, 'text-margin-y': -5, 'min-zoomed-font-size': 6, ...label } },
      { selector: 'node[many > 0]', style: { 'background-color': css('--acc'), 'font-weight': 600 } },
      { selector: 'node[src]', style: { shape: 'round-rectangle', 'background-color': css('--ok'), 'font-weight': 700, 'font-size': 12, 'text-max-width': 160 } },
      { selector: 'node[kind = "web"]', style: { 'background-color': css('--web') } }, { selector: 'node[kind = "video"]', style: { 'background-color': css('--vid') } },
      { selector: 'node[yr]', style: { 'background-opacity': 0, 'font-size': 15, 'font-weight': 700, color: css('--muted'), events: 'no', 'text-background-opacity': 0 } },
      { selector: 'edge', style: { width: 1, 'line-color': css('--line'), 'curve-style': 'bezier' } },
      { selector: 'edge[rel]', style: { width: 1.2, 'line-color': css('--muted'), 'target-arrow-shape': 'triangle', 'target-arrow-color': css('--muted'), 'arrow-scale': .7 } },

    ],

      : `<div class="k" style="margin-top:0">Concept</div><h3>${esc(d.label)}</h3><p>${md(d.def, null)}</p>` + (all ? `<div class="k">In ${d.in.length} source${d.in.length === 1 ? '' : 's'}</div>` + d.in.map(id => `<p><a href="#" data-open="${esc(id)}">${esc(byId(id)?.title)}</a></p>`).join('') : '');
  });
}

    for (const n of notes) if (n.project === old) { n.project = v; saveNote(n); }
    lsSet('projects', [...new Set(lsGet('projects', []).map(x => x === old ? v : x).concat(v))]);
    if (!merged && mxAll[old]) mxAll[v] = mxAll[old]; delete mxAll[old]; mxKeep();
    ACT.setproject({ dataset: { v } }); toast(merged ? `Merged “${old}” into the existing project “${v}”.` : `Renamed to “${v}”.`);
  },
  newproj: f => { const v = f.p.value.trim(); if (!v) return; lsSet('projects', [...new Set([...lsGet('projects', []), v])]); ACT.setproject({ dataset: { v } }); toast(`Project “${v}” created. Sources you add now are filed in it.`); },
  follow: async f => {
    const v = f.u.value.trim(), b = f.querySelector('button'); b.disabled = true; toast('Looking for the feed…');
    try {
      const g = await getFeed(/^https?:\/\//.test(v) ? v : 'https://' + v);
      if (!feeds.some(x => x.url === g.url)) { await send('PUT', 'feeds', { url: g.url, title: g.title }); feeds.push({ url: g.url, title: g.title }); }
      news = [...(news || []).filter(x => x.src !== g.url), ...g.items].sort((a, b) => b.date - a.date).slice(0, 40);
      toast(`Following ${g.title}.`); render();
    } catch (e) { toast('Could not follow that: ' + e.message); b.disabled = false; }
  },
  paste: f => {
    const pp = parseTranscript(f.t.value);
    if (pp.map(x => x.body).join('').length < 200) return toast("That doesn't look like a full transcript yet.");
    P.parts = pp; P.pages = pp.map(x => x.body); P.times = pp.map(x => x.t); // times stay on the item so citations show timestamps before the transcript is loaded
    save(P, pp); render(); renderBlocks(); analyze();
  },
};
function onClick(e) {
  const src = e.target.closest?.('a[href^="#src:"]'); // a citation in a notebook page: open the source at that passage
  if (src) { e.preventDefault(); const [, id, n] = src.getAttribute('href').split(':'); return byId(id) ? openItem(id, +n || 0) : toast('That source is no longer in your library.'); }
  const el = e.target.closest?.('[data-act],[data-page],[data-open],[data-view],[data-ins]'); if (!el) return;
  const d = el.dataset;
  if (d.ins) return insertMath(el);
  if (d.act) { if (/INPUT|SELECT/.test(el.tagName) && e.type !== 'change') return; if (el.tagName === 'A') e.preventDefault(); return ACT[d.act](el); }
  e.preventDefault();
  if (d.view) return go(d.view);
  if (d.open) return openItem(d.open, +d.n || 0);
  if (view !== 'read' || (d.pid && d.pid !== P.id)) return openItem(d.pid || P.id, +d.page);
  gotoPage(+d.page);
}
document.addEventListener('click', onClick);
// Fields save when you leave them. Nothing is re-rendered here: that would swallow the click that caused the blur.
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.act) return onClick(e);
  if (d.k === 'take' || d.k === 'col') save(byId(d.id));
  else if (d.k?.startsWith('nb')) { clearTimeout(nbT); saveNote(curNote()); renderRail(); }
  else if (d.k && P) { save(P); renderRail(); }
});
document.addEventListener('input', e => {
  const t = e.target, v = t.value;
  if (t.id === 'q') { F.q = v; libRows(); clearTimeout(ftT); ftT = setTimeout(ftSearch, 300); return; }
  if (t.id === 'nbq') return nbSide();
  if (t.dataset?.s) { S[t.dataset.s] = v; clearTimeout(ftT); ftT = setTimeout(() => view === 'matrix' ? mxTable() : drawBig(), 250); return; }  const pv = (t.closest('form') || t).nextElementSibling?.nextElementSibling;
  if (pv?.classList.contains('mprev')) { pv.innerHTML = /\$|\\\(/.test(v) ? md(v) : ''; window.renderMathInElement?.(pv, MATH); }
  SET[t.dataset.k]?.(v, t.dataset);
  if (t.dataset.k?.startsWith('nb')) { curNote().updated = Date.now(); clearTimeout(nbT); nbT = setTimeout(() => saveNote(curNote()), 1500); }
});
document.addEventListener('submit', e => { const f = e.target.dataset.f; if (f) { e.preventDefault(); FORM[f](e.target); } });
$('#resFile').onchange = e => e.target.files[0] && restore(e.target.files[0]).catch(err => toast('Not a valid Marrow backup: ' + err.message));
$('#file').onchange = e => addFiles(e.target.files);
document.ondragover = e => e.preventDefault();
document.ondrop = e => { e.preventDefault(); addFiles(e.dataTransfer.files); };

// ---------- reader tools: find, zoom, figure snip, timestamped notes ----------
function find(step) { // step 0: the query changed; 1 / -1: next / previous occurrence
  if (!P) return;
  const q = $('#find').value.trim().toLowerCase();
  if (q !== findQ || !step) {
    findQ = q.length > 1 ? q : ''; findI = 0; // one letter would match half the document
    findHits = !findQ ? [] : P.pages.flatMap((t, i) => { const out = []; for (let s = t.toLowerCase(), j = s.indexOf(findQ); j >= 0; j = s.indexOf(findQ, j + findQ.length)) out.push({ n: i + 1, k: out.length }); return out; });
  } else if (findHits.length) findI = (findI + step + findHits.length) % findHits.length;
  const h = findHits[findI];
  $('#findn').textContent = !q ? '' : q.length < 2 ? 'Type at least two letters' : h ? `${findI + 1} of ${findHits.length} · ${loc(P, h.n)} · Enter for the next` : 'No matches';
  const show = r => r?.startContainer.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const r = paintFind();
  if (r) show(r); else if (h) { gotoPage(h.n); setTimeout(() => show(paintFind()), 700); } // a PDF page that is not drawn yet: go there, then mark it
}
$('#find').oninput = () => { clearTimeout(ftT); ftT = setTimeout(() => find(0), 250); };
$('#find').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(ftT); find($('#find').value.trim().toLowerCase() === findQ ? (e.shiftKey ? -1 : 1) : 0); } };
$('#zi').onclick = () => rezoom(1.2);
$('#zo').onclick = () => rezoom(1 / 1.2);
$('#tnote').onclick = () => { P.notes.unshift({ page: nowPart() || undefined, note: '' }); save(P); tab = 'notes'; document.body.classList.add('study'); render(); $('#body textarea')?.focus(); };
$('#snipBtn').onclick = () => document.body.classList.toggle('snip') && toast('Drag a box around a figure, table or equation.');
$('#viewBtn').onclick = () => document.body.classList.toggle('study');
$('#doc').onscroll = e => { const d = e.target; $('#prog i').style.width = Math.min(100, d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight) * 100) + '%'; }; // how far through the source you are
$('#doc').onclick = e => { if (e.target.closest('.hl,.ul') && !getSelection().toString()) { tab = 'notes'; document.body.classList.add('study'); render(); } };
$('#doc').onpointerdown = e => {
  const d = e.target.closest('.page'); if (!d || !document.body.classList.contains('snip')) return;
  e.preventDefault(); const r = d.getBoundingClientRect(), box = document.createElement('div');
  box.id = 'snipbox'; d.append(box); try { d.setPointerCapture(e.pointerId); } catch {}
  snip = { d, box, x: e.clientX - r.left, y: e.clientY - r.top };
};
$('#doc').onpointermove = e => {
  if (!snip) return;
  const r = snip.d.getBoundingClientRect(); snip.x2 = e.clientX - r.left; snip.y2 = e.clientY - r.top;
  snip.box.style.cssText = `left:${Math.min(snip.x, snip.x2)}px;top:${Math.min(snip.y, snip.y2)}px;width:${Math.abs(snip.x2 - snip.x)}px;height:${Math.abs(snip.y2 - snip.y)}px`;
};
$('#doc').onpointerup = () => {
  if (!snip) return;
  const { d, box, x, y, x2, y2 } = snip, c = d.querySelector('canvas'), w = Math.abs(x2 - x), h = Math.abs(y2 - y);
  snip = null; box.remove(); document.body.classList.remove('snip');
  if (!c || !(w > 20 && h > 20)) return;
  const k = c.width / d.clientWidth, o = document.createElement('canvas'); o.width = w * k; o.height = h * k;
  o.getContext('2d').drawImage(c, Math.min(x, x2) * k, Math.min(y, y2) * k, w * k, h * k, 0, 0, w * k, h * k);
  ask(`Explain this figure, table or equation from p.${d.dataset.n}: what it shows, how to read it, and why it matters for the argument.`, o.toDataURL('image/jpeg', .85));
};

// ---------- selection toolbar ----------
let picked = null, selT;
document.addEventListener('selectionchange', () => {
  clearTimeout(selT);
  selT = setTimeout(() => {
    const s = getSelection(), str = s.toString().replace(/\s+/g, ' ').trim(), bar = $('#sel');
    const rg = s.rangeCount ? s.getRangeAt(0) : null, page = s.anchorNode?.parentElement?.closest('.page'), b0 = blkOf(rg?.startContainer);
    if (view !== 'read' || (!page && !b0) || str.length < 3) return bar.style.display = 'none';
    if (page) { const idx = spansOf(page).flatMap((x, i) => rg.intersectsNode(x) ? [i] : []); picked = { text: str.slice(0, 2000), page: +page.dataset.n, a: idx[0], b: idx.at(-1) }; }
    else {
      const b1 = blkOf(rg.endContainer); // a selection that runs out of the text ends with its first block
      picked = { text: str.slice(0, 2000), page: +b0.dataset.n, a: offIn(b0, rg.startContainer, rg.startOffset), eb: +(b1 || b0).dataset.n, b: b1 ? offIn(b1, rg.endContainer, rg.endOffset) : b0.textContent.length };
    }
    const r = rg.getBoundingClientRect();
    bar.style.display = 'flex';
    bar.style.top = Math.max(8, r.top - 48) + 'px'; bar.style.left = Math.max(8, Math.min(innerWidth - bar.offsetWidth - 8, r.left)) + 'px';
  }, 250);
});
$('#sel').onclick = e => {
  const btn = e.target.closest('button'), k = btn?.dataset.s, { text: quote, ...at } = picked; if (!k) return;
  getSelection().removeAllRanges();
  const mark = (extra, open) => {
    P.notes.unshift({ quote, ...at, note: '', ...extra }); save(P); paintAll();
    if (open) { tab = 'notes'; document.body.classList.add('study'); render(); $('#body textarea')?.focus(); }
    else { if (tab === 'notes') render(); toast('Saved to this source’s Notes.'); }
  };
  if (k === 'hl') mark({ c: +btn.dataset.c });
  if (k === 'ul') mark({ ul: 1 });
  if (k === 'note') mark({ c: 1 }, true);
  if (k === 'explain') ask(`Explain this passage from p.${at.page} in plain language, with the intuition behind it:\n"${quote}"`);
  if (k === 'card') run('Writing a flashcard…', async p => {
    const j = await aiJSON('Turn the passage into one flashcard that tests the underlying idea. JSON: {"q":"","a":"short answer"}', quote);
    p.cards.push({ q: j.q, a: j.a }); toast('Card added: ' + j.q);
  });
};

// ---------- boot ----------
try {
  ({ items: lib, notes, activity, feeds = [] } = await api('library'));
  F.project = lsGet('project', ''); if (!projects().includes(F.project)) F.project = '';
  // Repair sources analyzed before the fix above: if every checkpoint already has an answer and none was ever checked, the AI wrote them, not the reader.
  for (const p of lib) if (p.sections.length > 1 && p.sections.every(s => s.answer && !s.done && !s.feedback)) { p.sections.forEach(s => delete s.answer); save(p); }
  await migrate().catch(e => toast('Could not move your old in-browser library over: ' + e.message + '. It is still safe in this browser.'));
} catch (e) { toast('Could not reach the Marrow server (' + e.message + '). Check that it is still running, then reload this page.'); }
enter($('#page')); render();
</script>
