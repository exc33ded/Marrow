[data-look=concourse][data-theme=dark]{--bg:#141414;--panel:#222;--ink:#f2f2f2;--muted:#b8b8b8;--line:#434343;--acc:#78b4ff;--acc-bg:#1d3354;--ok:#5fd08a;--pdf:#0b0b0b;--web:#78b4ff;--vid:#ff8a80;--sh:none;--pop:none;--pri:#FFD100;--pri-h:#FFE35C;--on-pri:#111;--on-n:#111;--scrim:#000000c0;--logo-a:#111;--logo-b:#111;--sig:#FFD100;--f-body:"Source Sans 3",system-ui,"Segoe UI",sans-serif;--f-display:"Source Sans 3",system-ui,"Segoe UI",sans-serif;--f-mono:"Source Sans 3",system-ui,"Segoe UI",sans-serif;--r:2px;--r2:3px;--h0:#363636;--h1:#666;--h2:#929292;--h3:#c0c0c0;--h4:#f4f4f4;--fr:#cfcfcf;--fc:#FFD100;--cb:#000;--ct:#FFD100;color-scheme:dark}
html[data-look=concourse] body{font-variant-numeric:tabular-nums;letter-spacing:0}
html[data-look=concourse] :focus-visible{outline:3px solid var(--fc);outline-offset:2px}

/* signature: wayfinding bands */
html[data-look=concourse] h1,html[data-look=concourse] .sec{position:relative;background:var(--cb);color:var(--ct);border:2px solid var(--cb);border-radius:var(--r);padding:.3em 56px .3em 16px}

html[data-look=concourse] article h1{all:unset;display:block;font:700 1.9em/1.2 var(--f-display);margin:.2em 0 .4em;color:var(--ink)}
html[data-look=concourse] .sec{align-items:center;margin:30px 0 14px;color:#fff;min-height:44px}
html[data-look=concourse] .sec h3{color:var(--ct);font-size:21px;font-weight:700}
html[data-look=concourse] .sec .muted,html[data-look=concourse] .sec small{color:#e2e2e2;font-weight:700}
html[data-look=concourse] .sec a{color:var(--ct)}
html[data-look=concourse] :is(h1,.sec)::after{content:"";position:absolute;right:16px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:0;border-left:15px solid var(--ct)}
html[data-look=concourse] h1,html[data-look=concourse] h2,html[data-look=concourse] h3,html[data-look=concourse] h4{font-weight:700}
/* rail */
html[data-look=concourse] #rail{background:#FFD100;border-right:2px solid #111;color:#111}
html[data-look=concourse] .logo{background:#111;color:#fff;border-radius:var(--r);font-weight:800}
html[data-look=concourse] #rail button{color:#111;font-weight:700;border-radius:var(--r);transition:none}
html[data-look=concourse] #rail button:hover{background:#00000022;color:#111}

html[data-look=concourse] #rail .n{background:#fff;color:#111;border:2px solid #111;border-radius:var(--r);font-weight:800;font-size:11px;line-height:14px;padding:0 4px;top:0;right:4px}

/* frames and controls */
html[data-look=concourse] :is(.card,.box,.fact,.term,.addbar,.mxwrap,.pickbar,.msg,.icons,#cy,.askbar,#peek,#sure,#pal,.lookcard){border:2px solid var(--fr);border-radius:var(--r);box-shadow:none}
html[data-look=concourse] .askbar{border-radius:var(--r)}
html[data-look=concourse] :is(button,.btn,input,textarea,select){border:2px solid var(--fr);border-radius:var(--r);transition:none}
html[data-look=concourse] button:hover,html[data-look=concourse] .btn:hover{border-color:var(--fr);background:var(--line)}
html[data-look=concourse] button:active{transform:none;background:var(--ink);color:var(--panel)}
html[data-look=concourse] button.pri{background:var(--pri);color:var(--on-pri);border:2px solid #111;font-weight:700}
html[data-look=concourse] button.pri:hover{background:var(--pri-h);border-color:#111}
html[data-look=concourse] button.pri:active{background:#111;color:#FFD100}
html[data-look=concourse] button:disabled{opacity:1;background:var(--line);color:var(--muted);border-style:dashed;cursor:not-allowed}
html[data-look=concourse] input,html[data-look=concourse] textarea,html[data-look=concourse] select{background:var(--panel)}

html[data-look=concourse] .addbar:focus-within{border-color:var(--fr);outline:3px solid var(--fc);outline-offset:2px}
html[data-look=concourse] :is(.x,.nbtop button,.pico,.addico,.prop .add,.mx th button,.mx td .add,.icons button,#rail button,#tabs button,#pall button,.chip,.askbar form button){border-width:0}
html[data-look=concourse] .chip{border:2px solid var(--fr);border-radius:var(--r)}
html[data-look=concourse] .chip.on,html[data-look=concourse] .item.on,html[data-look=concourse] .lookcard[aria-pressed=true],html[data-look=concourse] .pickbar{background:#FFD100;color:#111;border-color:#111;font-weight:700}
html[data-look=concourse] .lookcard[aria-pressed=true]{outline:0}
html[data-look=concourse] .lookcard[aria-pressed=true] small{color:#111}
html[data-look=concourse] .card:hover{border-color:var(--fr);transform:none;background:var(--bg)}
html[data-look=concourse] .card.flat:hover{background:var(--panel)}
html[data-look=concourse] .card h4,html[data-look=concourse] .card b{font-weight:700}
html[data-look=concourse] .rows,html[data-look=concourse] .grid{gap:12px}
html[data-look=concourse] .tag,html[data-look=concourse] .num,html[data-look=concourse] #tabs i{border-radius:var(--r);font-weight:700}
html[data-look=concourse] .tag.proj,html[data-look=concourse] .tag.ok{border-width:2px;border-style:solid}
html[data-look=concourse] .tag.proj{border-color:var(--fr);color:var(--ink)}
html[data-look=concourse] .kind{letter-spacing:.04em}
html[data-look=concourse] .cover{border-radius:0;margin:-14px -14px 4px;border-bottom:2px solid var(--fr)}
html[data-look=concourse] .cover .kind,html[data-look=concourse] .cover .ring{border:2px solid var(--fr);border-radius:var(--r);box-shadow:none}
html[data-look=concourse] .cover .kind{background:var(--panel);color:var(--ink)}
html[data-look=concourse] .bar,html[data-look=concourse] .bar i{border-radius:0}
html[data-look=concourse] .bar{height:8px;border:1px solid var(--fr);background:var(--panel)}
html[data-look=concourse] .tldr{border:2px solid var(--fr);border-left-width:8px;border-radius:var(--r);background:var(--panel)}
html[data-look=concourse] .fact.key{border-color:var(--fr);border-left:8px solid var(--ok)}
html[data-look=concourse] blockquote{border-left-color:var(--fr)}
html[data-look=concourse] code,html[data-look=concourse] .srcchip{background:var(--line);color:var(--ink)}
/* monumental numerals */
html[data-look=concourse] .facts{font-size:20px;font-weight:700;gap:6px 28px;margin-bottom:10px}
html[data-look=concourse] :is(.facts b,.facts strong,.badge,.ring){font-weight:800;font-variant-numeric:tabular-nums}
html[data-look=concourse] .facts :is(b,strong){font-size:1.4em}
html[data-look=concourse] .ring{--in:var(--panel);width:40px;height:40px;font-size:13px}
/* activity grid */
html[data-look=concourse] .heat i,html[data-look=concourse] .hleg i{border-radius:1px}
html[data-look=concourse] .heat i[data-l="0"],html[data-look=concourse] .heat i:not([data-l]),html[data-look=concourse] .hleg i:first-of-type{box-shadow:inset 0 0 0 1px var(--muted)}

html[data-look=concourse] .heat,html[data-look=concourse] .hleg{color:var(--ink);font-size:12px}
/* tabs, nav lists, palette */
html[data-look=concourse] #tabs{border-bottom:2px solid var(--fr)}
html[data-look=concourse] #tabs button{border-radius:var(--r);color:var(--ink);font-weight:600}
html[data-look=concourse] #tabs button.on{background:#FFD100;color:#111;font-weight:700;box-shadow:inset 0 -4px 0 #111}
html[data-look=concourse] #tabs i{background:var(--line);color:var(--ink)}
html[data-look=concourse] #tabs .on i,html[data-look=concourse] .num{background:#111;color:#fff}
html[data-look=concourse] #tabs .done i,html[data-look=concourse] .done .num{background:var(--ok);color:var(--bg)}
html[data-look=concourse] [data-theme=dark] .done .num,html[data-look=concourse][data-theme=dark] :is(#tabs .done i,.done .num){color:#111}
html[data-look=concourse] header,html[data-look=concourse] #tools{border-bottom:2px solid var(--fr)}
html[data-look=concourse] #panel{border-left:2px solid var(--fr)}
html[data-look=concourse] .nbside{border-right:2px solid var(--fr)}
html[data-look=concourse] .nbside .lbl{color:var(--ink);font-weight:700}
html[data-look=concourse] .prow{color:var(--ink);height:34px;font-weight:600}
html[data-look=concourse] .prow:hover{background:var(--line)}
html[data-look=concourse] .prow.on{background:#FFD100;color:#111;font-weight:700;box-shadow:inset 4px 0 0 #111}
html[data-look=concourse] .prow.on .ico,html[data-look=concourse] .prow.on .t{color:#111}
html[data-look=concourse] .prow .ico{color:var(--ink)}
html[data-look=concourse] .nbtop{border-bottom:2px solid var(--fr);color:var(--ink)}
html[data-look=concourse] .nbtop button{color:var(--ink)}
html[data-look=concourse] .nbtop button:hover,html[data-look=concourse] .item:hover,html[data-look=concourse] #pall button:hover{background:var(--line);color:var(--ink)}
html[data-look=concourse] .item{border-radius:var(--r)}
html[data-look=concourse] .item:hover{background:var(--line)}
html[data-look=concourse] #pall button.on,html[data-look=concourse] .seg.now{background:#FFD100;color:#111;font-weight:700}
html[data-look=concourse] #pall button.on .muted{color:#111}
html[data-look=concourse] #palq{border-bottom:2px solid var(--fr)}
html[data-look=concourse] #pal{margin-top:12vh}
/* matrix */
html[data-look=concourse] .mx th{background:var(--cb);color:var(--ct);font-weight:700;letter-spacing:.04em}
html[data-look=concourse] .mx th small,html[data-look=concourse] .mx th button{color:#e2e2e2}
html[data-look=concourse] .mx th,html[data-look=concourse] .mx td{border-bottom:2px solid var(--fr)}
html[data-look=concourse] .mx td:first-child,html[data-look=concourse] .mx th:first-child{border-right:2px solid var(--fr)}
html[data-look=concourse] .mx td:first-child{font-weight:700}
html[data-look=concourse] .mx td textarea:hover,html[data-look=concourse] .mx td textarea:focus{border:2px solid var(--fr);background:var(--panel)}
/* misc */
html[data-look=concourse] #status{background:#FFD100;color:#111;border:2px solid #111;border-radius:var(--r);font-weight:600}
html[data-look=concourse] #status::before{border-color:#111;border-top-color:transparent}
html[data-look=concourse] #toast{border:2px solid var(--fr);border-radius:var(--r)}
html[data-look=concourse] #sure .danger{background:var(--vid);color:#fff;border:2px solid var(--fr);font-weight:700}
html[data-look=concourse][data-theme=dark] #sure .danger{color:#111}
html[data-look=concourse] .runhead{border-bottom:2px solid var(--fr);color:var(--ink)}
html[data-look=concourse] .askbar{box-shadow:none}
html[data-look=concourse] .ce-popover__container{border:2px solid var(--fr)!important;border-radius:var(--r)!important;box-shadow:none!important}
html[data-look=concourse] article{border:2px solid var(--fr);box-shadow:none}
html[data-look=concourse] .warn{color:var(--ink);font-weight:600}
html[data-look=concourse] :is(.addbar input,.nbside #nbq,.prop input,.ttl,.askbar input,#palq){background:none}
html[data-look=concourse] .prop input:hover,html[data-look=concourse] .prop input:focus{background:var(--line)}
html[data-look=concourse] h1{flex:1 1 auto}
html[data-look=concourse] .lookcard .sw{border:2px solid #111}
/* look: cyanotype.css */
/* cyanotype: white linework on Prussian blue, after Atkins's British Algae (1843). Signature: the plate (double-rule frame + caption headings). */
[data-look=cyanotype]{--bg:#d9e6f0;--panel:#f5f9fc;--ink:#0a2742;--muted:#43617e;--line:#9db8cf;--acc:#1559a6;--acc-bg:#dbe9f6;--ok:#1d7a6d;--pdf:#c6d8e7;--web:#0b6685;--vid:#c0392b;--sh:none;--pop:0 6px 18px #0a274233;--pri:#0f3a63;--pri-h:#1a4f84;--on-pri:#fff;--on-n:#fff;--scrim:#04111fa6;--logo-a:#1c5a96;--logo-b:#0a2a4a;--sig:#0f3a63;
--f-body:Archivo,system-ui,sans-serif;--f-display:"Libre Caslon Text","Iowan Old Style",Georgia,serif;--f-mono:Archivo,system-ui,sans-serif;--r:2px;--r2:2px;
--h0:#bcd0e2;--h1:#8fb3d3;--h2:#5b8fbf;--h3:#2d669f;--h4:#0a2a4a;--rail:#0f3a63;--rail2:#0a2a4a;--ctl:#6f93b3;color-scheme:light}
[data-look=cyanotype][data-theme=dark]{--bg:#071a30;--panel:#0d2745;--ink:#dcebf7;--muted:#93afc8;--line:#2c5f93;--acc:#7fd0ff;--acc-bg:#123a63;--ok:#4fc3b3;--pdf:#04111f;--web:#8ec5ff;--vid:#ff8d80;--sh:none;--pop:0 6px 18px #000a;--pri:#7fd0ff;--pri-h:#a6deff;--on-pri:#04111f;--on-n:#04111f;--scrim:#000b;--logo-a:#1c5a96;--logo-b:#0a2a4a;--sig:#3a86c8;
--f-body:Archivo,system-ui,sans-serif;--f-display:"Libre Caslon Text","Iowan Old Style",Georgia,serif;--f-mono:Archivo,system-ui,sans-serif;--r:2px;--r2:2px;
--h0:#12304f;--h1:#1f5a93;--h2:#3b86c4;--h3:#86c3ee;--h4:#e8f5ff;--rail:#04111f;--rail2:#020a14;--ctl:#4a7fb5;color-scheme:dark}
html[data-look=cyanotype] body{font-variant-numeric:tabular-nums;letter-spacing:.005em}
html[data-look=cyanotype] :is(h1,h2,h3,h4,b.h,.q,.ttl,.tldr,.peekbody,.hero){font-weight:400}
html[data-look=cyanotype] h1{font-size:38px;letter-spacing:-.2px;margin:.3em 0 .5em} html[data-look=cyanotype] .hero{font-size:48px;line-height:1.12}
html[data-look=cyanotype] .lead{font-size:17px;line-height:1.7;margin:.4em 0 1.8em}
html[data-look=cyanotype] .wrap{padding:48px 40px 110px} html[data-look=cyanotype] .wrap.narrow .box{padding:32px 34px}
html[data-look=cyanotype] :is(.kind,.k,.mx th,kbd){font-family:var(--f-body)!important;font-variant-numeric:tabular-nums}
html[data-look=cyanotype] .kind{font-family:var(--f-display)!important;font-style:italic;font-weight:400;text-transform:none;letter-spacing:.02em;font-size:13.5px}
html[data-look=cyanotype] .k{font-style:italic;font-family:var(--f-display)!important;font-weight:400;text-transform:none;font-size:13px;letter-spacing:.03em}
/* rail: the shell is the colour */
html[data-look=cyanotype] #rail{background:var(--rail);color:#fff;border-right:1px solid var(--line);scrollbar-color:#2c5f93 transparent}
html[data-look=cyanotype] .logo{background:linear-gradient(160deg,var(--logo-a),var(--logo-b));color:#fff;border:1px solid #fffc;font-weight:400;font-style:italic;box-shadow:inset 0 0 0 2px var(--rail),inset 0 0 0 3px #fff6}
html[data-look=cyanotype] #rail button{color:#cfe2f3;font-weight:500;letter-spacing:.02em}
html[data-look=cyanotype] #rail button:hover{background:#ffffff1f;color:#fff}
html[data-look=cyanotype] #rail button.on{background:#ffffff26;color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px #ffffffb3}
html[data-look=cyanotype] #rail button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
html[data-look=cyanotype] #rail .n{background:#fff;color:#0a2a4a;font-weight:700}
html[data-look=cyanotype] :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* controls */
html[data-look=cyanotype] :is(input,textarea,select){background:var(--panel);border-color:var(--ctl)}
html[data-look=cyanotype] :is(.fbar,.filters,.nbside,.mx td) :is(input,textarea):not([type=checkbox]){background:var(--panel)}
html[data-look=cyanotype] button,html[data-look=cyanotype] .btn{border-color:var(--ctl);padding:.5em 1.05em;letter-spacing:.01em}
html[data-look=cyanotype] button:hover,html[data-look=cyanotype] .btn:hover{border-color:var(--acc);background:var(--acc-bg)}
html[data-look=cyanotype] button.pri{border:1px solid var(--pri);background:var(--pri);color:var(--on-pri);font-weight:600} html[data-look=cyanotype] button.pri:hover{background:var(--pri-h);border-color:var(--pri-h)}
html[data-look=cyanotype] button:disabled{opacity:.55;border-style:dashed}
html[data-look=cyanotype] .tag{border-radius:2px;border:1px solid var(--acc);font-weight:600;letter-spacing:.02em}
html[data-look=cyanotype] .tag.proj{border-color:var(--ctl)} html[data-look=cyanotype] .tag.ok{border-color:var(--ok)}
html[data-look=cyanotype] .chip{border-radius:2px;border-color:var(--ctl)} html[data-look=cyanotype] .chip.on{border-width:2px;background:var(--acc-bg);color:var(--ink);font-weight:700}
html[data-look=cyanotype] .addbar{border-color:var(--ctl);padding:10px 12px}
html[data-look=cyanotype] mark{background:#ffd60080;color:inherit}
html[data-look=cyanotype] *{scrollbar-color:var(--ctl) transparent} html[data-look=cyanotype] *::-webkit-scrollbar-thumb{background:var(--ctl);background-clip:content-box;border-radius:2px}
/* THE PLATE: double-rule frame (outer border + inner hairline), no shadows */
html[data-look=cyanotype] :is(.card,.box,.fact,.term,.msg,.pickbar){border-color:var(--line);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line)}
html[data-look=cyanotype] .card{padding:20px;gap:10px;transition:border-color .15s} html[data-look=cyanotype] button.card{padding:20px}
html[data-look=cyanotype] .rows .card{padding:13px 20px}
html[data-look=cyanotype] .card:hover{transform:none;border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--acc)}
html[data-look=cyanotype] .card.flat:hover{border-color:var(--line);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line)}
html[data-look=cyanotype] .box{padding:20px} html[data-look=cyanotype] .box.done{border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--ok)}
html[data-look=cyanotype] .fact{padding:6px 20px 16px} html[data-look=cyanotype] .term{padding:12px 14px}
html[data-look=cyanotype] .msg.user{border:1px solid var(--line)}
html[data-look=cyanotype] :is(#peek,#sure){box-shadow:var(--pop),inset 0 0 0 5px var(--panel),inset 0 0 0 6px var(--line)} html[data-look=cyanotype] .pk{padding:34px 40px 28px}
html[data-look=cyanotype] #pal{border-color:var(--ctl)}
html[data-look=cyanotype] .sec{border-top:1px solid var(--muted);padding-top:8px;margin:40px 0 16px;align-items:baseline}
html[data-look=cyanotype] .sec h3{font:italic 400 15px var(--f-display);font-variant-caps:all-small-caps;letter-spacing:.09em}
html[data-look=cyanotype] .sec :is(.muted,small,span){font-family:var(--f-display);font-style:italic;font-size:13.5px}
html[data-look=cyanotype] .tldr{background:var(--acc-bg);border:1px solid var(--line);font-size:19px;line-height:1.6;padding:18px 20px}
html[data-look=cyanotype] blockquote{border-left:1px solid var(--acc);padding-left:14px;font-family:var(--f-display);font-style:italic}
html[data-look=cyanotype] .runhead{font-family:var(--f-display);font-style:italic;text-transform:none;letter-spacing:.04em;font-size:13px}
/* cover thumbnails: blue duotone */
html[data-look=cyanotype] .cover{background:linear-gradient(135deg,#d3e4f3,#6f9bc6);color:#0a2a4a;border-radius:2px;border:1px solid var(--line);margin:-6px -6px 2px}

async function ai(messages) {

async function sourceText(p, q) {

  if (k === 'ul') mark({ ul: 1 });
  if (k === 'note') mark({ c: 1 }, true);
  if (k === 'explain') ask(`Explain this passage from p.${at.page} in plain language, with the intuition behind it:\n"${quote}"`);
  if (k === 'card') run('Writing a flashcard…', async p => {
    const j = await aiJSON('Turn the passage into one flashcard that tests the idea behind it. ' + CARD_RULES + ' JSON: {"q":"","a":""}', quote);
    p.cards.push({ q: j.q, a: j.a }); toast('Card added: ' + j.q);
  });
};

// ---------- boot ----------
// First launch: nothing loads until the reader says where the library lives. A browser can't open a folder picker that answers with a path on the server, so it is typed.
let ST = await api('store').catch(() => ({}));
if (ST.dir === null) await new Promise(() => {
  document.body.insertAdjacentHTML('beforeend', `<div id="firstrun" style="position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto">
    <form data-f="firstrun" class="box" style="width:min(560px,100%)"><h2 style="margin-top:0">Where should Marrow keep your library?</h2>
      <p class="muted">Everything goes in one folder: the library (<code>marrow.db</code>), your PDFs and a Markdown copy of every source and notebook page, in a folder per project. You can move it later in Settings.</p>
      ${ST.legacy ? `<p>Your library is in <code style="word-break:break-all">${esc(ST.legacy)}</code>. Keep that folder, or give another and it is copied there (the old folder is left as it is).</p>` : ''}
      <label for="frdir">Folder (full path)</label><input id="frdir" name="dir" required value="${esc(ST.suggest || '')}" autocomplete="off" spellcheck="false">
      <p id="frerr" role="alert" style="color:var(--vid);min-height:1.4em;margin:8px 0 0"></p><button class="pri">Use this folder</button></form></div>`);
  $('#frdir').focus();
}); // waits forever: choosing the folder reloads the page
try {
  const L0 = await api('library');
  ({ items: lib, notes, activity, feeds = [], projects: PJ = [] } = L0);
  // Sources and pages from before the library folder have no Markdown copy yet: saving each once writes it.
  for (const id of L0.unmirrored || []) { const p = byId(id); if (p) save(p); else saveNote(notes.find(n => n.id === id)); }
  const old = lsGet('projects', []).filter(x => !PJ.includes(x)); // project names this browser kept before they moved into the database
  if (old.length) { PJ = [...PJ, ...old]; await saveProjects(); } try { delete localStorage.projects; } catch {}
  F.project = lsGet('project', ''); if (!projects().includes(F.project)) F.project = '';
  // Repair sources analyzed before the fix above: if every checkpoint already has an answer and none was ever checked, the AI wrote them, not the reader.
  for (const p of lib) if (p.sections.length > 1 && p.sections.every(s => s.answer && !s.done && !s.feedback)) { p.sections.forEach(s => delete s.answer); save(p); }
  await migrate().catch(e => toast('Could not move your old in-browser library over: ' + e.message + '. It is still safe in this browser.'));
} catch (e) { toast('Could not reach the Marrow server (' + e.message + '). Check that it is still running, then reload this page.'); }
try { const c = JSON.parse(localStorage.newsCache); if (c && feeds.length) { news = c.items.filter(x => feeds.some(f => f.url === x.src)); newsAt = c.at; } } catch {} // posts from the last visit, shown at once
{ const [v, a, b] = location.hash.slice(2).split('/'); // restore the screen from the URL: #/library, #/notebook/ID, #/read/ID/tab
  if (v === 'read' && byId(a)) { await openItem(a); if (TABS.some(t => t[0] === b)) tab = b; }
  else if (PAGE[v]) { N = a || null; v === 'settings' ? go(v) : view = v; } }
enter($('#page')); render(); loadNews(); // the unread count on Discover's nav button
loadWh().then(() => view === 'read' && tab === 'brief' && P?.kind === 'video' && !P.pages.length && render()).catch(() => {}); // a video without a transcript offers Whisper
</script>
</body>
