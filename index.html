<style>
/* palette: the grey-green of a lab notebook's ruled paper, with rust ink as the one accent */
:root{--bg:#edf1ee;--panel:#fbfcfb;--ink:#171c19;--muted:#5d6962;--line:#d8dfda;--acc:#b4460f;--acc-bg:#f8e4d4;--ok:#2f7d4f;--pdf:#dde4df;--web:#2a6a9c;--vid:#b3261e;--sh:0 1px 2px #0000000f,0 8px 24px #0000000d;color-scheme:light}
[data-theme=dark]{--bg:#0f1412;--panel:#161c19;--ink:#e4eae6;--muted:#8c9991;--line:#29322d;--acc:#f08a4b;--acc-bg:#3a2415;--ok:#6cc08c;--pdf:#090c0a;--web:#7fb6e0;--vid:#f2857c;--sh:0 1px 2px #0006,0 8px 24px #0004;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:78px minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden;transition:background .2s,color .2s}
h1,h2,h3,h4,.q{font-family:Newsreader,"Iowan Old Style",Georgia,serif;margin:.2em 0 .4em;line-height:1.2}
h1{font-size:30px;letter-spacing:-.4px}
a{color:var(--acc)}
button,input,textarea,select{font:inherit;color:inherit}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.45em .9em;cursor:pointer;min-height:36px;text-decoration:none;color:inherit;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s var(--e)}
button:hover,.btn:hover{border-color:var(--acc)} button:active{transform:scale(.97)}
button.pri{background:#b4460f;border:0;color:#fff;font-weight:600} button.pri:hover{background:#c5521a}
button:disabled{opacity:.5;cursor:wait}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55em .75em}
select{width:auto}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.muted{color:var(--muted)} .row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center} .sp{flex:1}
code{background:var(--line);padding:0 .3em;border-radius:4px;font-size:.9em}
blockquote{margin:.3em 0;padding:.2em .8em;border-left:3px solid var(--acc);color:var(--muted);font-size:13.5px}
b.h{display:block;font:700 18px Newsreader,Georgia,serif;margin:.9em 0 .3em} b.h:first-child{margin-top:0}
.pl{display:block;margin:.35em 0} .gap{display:block;height:.35em}
ul,ol{padding-left:1.3em;margin:.4em 0} li{margin:.25em 0} hr{border:0;border-top:1px solid var(--line);margin:1em 0}
/* motion: one easing curve, transform and opacity only. Entrances play after navigation (.in, set by enter()), never on re-renders caused by typing or saving. */
:root{--e:cubic-bezier(.22,1,.36,1);interpolate-size:allow-keywords}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.97)}}
@keyframes fill{from{--p:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
@keyframes vtout{to{opacity:0}} @keyframes vtin{from{opacity:0}}
.in>.wrap>*,#body.in>*,#doc.in>article,#doc.in>.vid,.in :is(.grid,.rows,.tiles)>*,.fxin{animation:rise .45s var(--e) backwards}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(2),#body.in>:nth-child(2){animation-delay:35ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(3),#body.in>:nth-child(3){animation-delay:70ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(4),#body.in>:nth-child(4){animation-delay:105ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(5),#body.in>:nth-child(5){animation-delay:140ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(6),#body.in>:nth-child(6){animation-delay:175ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(7),#body.in>:nth-child(7){animation-delay:210ms}
.in :is(.wrap,.grid,.rows,.tiles)>:nth-child(n+8),#body.in>:nth-child(n+8){animation-delay:245ms}
.in .ring{animation:fill .9s var(--e) .15s backwards}
.in .bar i{transform-origin:left;animation:grow .8s var(--e) .2s backwards}
::view-transition-old(root){animation:vtout .12s ease-in both} ::view-transition-new(root){animation:vtin .22s ease-out both}
details::details-content{block-size:0;overflow:clip;transition:block-size .3s var(--e),content-visibility .3s allow-discrete} details[open]::details-content{block-size:auto}
.sk{display:block;height:13px;border-radius:7px;margin:11px 0;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 45%,var(--panel)) 40%,var(--line) 60%) 0/300% 100%;animation:shim 1.6s linear infinite}
h1,h2,h3,h4{text-wrap:balance}
kbd{font:600 11px "Schibsted Grotesk",system-ui;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:7px;opacity:.55}
@media (hover:none){kbd{display:none}}
@media (prefers-reduced-motion:reduce){*,::view-transition-group(root),::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}}
.cover{--h:20;height:112px;border-radius:11px;margin:-5px -5px 2px;background:linear-gradient(135deg,hsl(var(--h) 60% 90%),hsl(calc(var(--h) + 45) 55% 80%)) center/cover;display:grid;place-items:center;color:hsl(var(--h) 45% 38%);position:relative}
[data-theme=dark] .cover{background-image:linear-gradient(135deg,hsl(var(--h) 35% 24%),hsl(calc(var(--h) + 45) 40% 15%));color:hsl(var(--h) 55% 72%)}
.cover .kind{position:absolute;left:8px;top:8px;background:var(--panel);padding:3px 9px;border-radius:99px;box-shadow:var(--sh)} .cover .ring{position:absolute;right:8px;top:8px;box-shadow:var(--sh)}
.cover.shot::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(#0000 40%,#0006)}
.step{font-weight:600;color:var(--acc)}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.tldr{font:600 18px/1.5 Newsreader,Georgia,serif;background:var(--acc-bg);border-radius:14px;padding:14px 16px;margin:14px 0}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 14px 12px;margin:10px 0;box-shadow:var(--sh)} .fact .k{margin-top:12px} .fact.key{border-color:var(--acc)}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px} .term{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.45} .term b{display:block;margin-bottom:2px}
#prog{height:3px;background:var(--line);flex:none} #prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .1s}
.wrap.narrow .box{padding:26px 28px} .wrap.narrow .q{font-size:25px;margin:.5em 0 .7em} .wrap.narrow .box button{min-width:92px}
/* rail */
#rail{view-transition-name:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;overflow:auto}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(160deg,#d65f1f,#9c3a0a);color:#fff;font:700 24px Newsreader,Georgia,serif;display:grid;place-items:center;margin-bottom:10px;flex:none}
#nav{display:contents}
#rail button{border:0;background:none;width:66px;padding:8px 0 6px;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:12px;position:relative;min-height:0;flex:none}
#rail button:hover{color:var(--ink);background:var(--bg)} #rail button.on{background:var(--acc-bg);color:var(--acc)}
#rail .n{position:absolute;top:2px;right:8px;background:var(--acc);color:#fff;border-radius:99px;font-size:10px;line-height:16px;padding:0 5px}
[data-theme=dark] #rail .n{color:#1b1916}
/* pages */
#page{overflow:auto;min-width:0}
.wrap{max-width:1060px;margin:0 auto;padding:36px 28px 90px} .wrap.narrow{max-width:680px} .wrap.wide{max-width:1500px}
.hero{font-size:40px;margin:0} .lead{font-size:16.5px;margin:.2em 0 1.4em}
.addbar{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--sh);margin:0 0 22px}
.addbar input{border:0;background:none;font-size:15.5px;min-width:0} .addbar input:focus-visible{outline:0} .addbar:focus-within{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);text-align:left;white-space:normal;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tile b{font:700 34px/1 Newsreader,Georgia,serif;margin-bottom:6px} .tile small{color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(12,1fr);grid-auto-flow:column;gap:3px;margin-top:8px;width:100%;max-width:190px}
.heat i{border-radius:3px;aspect-ratio:1;background:color-mix(in srgb,var(--ok) calc(var(--a)*100%),var(--line))}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px} .sec h3{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card h4{font-size:16.5px;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
button.card{text-align:left;white-space:normal;align-items:flex-start;gap:6px;padding:16px}
.card.flat{cursor:default} .card.flat:hover{transform:none;border-color:var(--line)}
.rows{display:flex;flex-direction:column;gap:8px}
.rows .card{flex-direction:row;align-items:center;gap:12px;padding:10px 14px} .rows .card:hover{transform:none}
.grow{flex:1;min-width:0} .grow b{font-weight:600}
.kind{display:inline-flex;gap:5px;align-items:center;font:700 11px "Schibsted Grotesk",system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--acc)} .kind.web{color:var(--web)} .kind.video{color:var(--vid)}
.tag{font:600 11px "Schibsted Grotesk",system-ui;background:var(--acc-bg);color:var(--acc);border-radius:99px;padding:2px 9px;cursor:pointer;white-space:nowrap;display:inline-block}
.tag.proj{background:none;border:1px solid var(--line);color:var(--muted)} .tag.ok{background:none;border:1px solid var(--ok);color:var(--ok);cursor:default}
.chip{border-radius:99px;min-height:32px;padding:.2em .9em;font-size:13.5px} .chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
.filters{margin:0 0 14px} .filters #q{flex:1;min-width:220px;width:auto}
.x{border:0;background:none;padding:0 6px;min-height:0;color:var(--muted)}
mark{background:#ffd60070;color:inherit;border-radius:2px}
.ring{--p:0;--in:var(--panel);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 11px "Schibsted Grotesk",system-ui;flex:none;
  background:radial-gradient(closest-side,var(--in) 74%,transparent 76%),conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.clamp{overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mxwrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--sh);max-height:calc(100vh - 200px)}
.mx{border-collapse:separate;border-spacing:0;font-size:13.5px}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top;text-align:left;min-width:190px}
.mx th{position:sticky;top:0;background:var(--panel);font:700 11px "Schibsted Grotesk",system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);z-index:2}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--panel);min-width:210px;max-width:230px;z-index:1;border-right:1px solid var(--line)} .mx th:first-child{z-index:3}
.mx textarea{min-height:90px;font-size:13px}
.nb{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px}
.item{display:flex;flex-direction:column;padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel)} .item.on{border-color:var(--acc);background:var(--acc-bg)}
.item b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{font:700 26px Newsreader,Georgia,serif;border:0;background:none;padding:0;margin-bottom:8px}
.nbedit textarea{min-height:46vh;margin-top:10px;font-size:15px;line-height:1.6}
#cy{height:420px;border:1px solid var(--line);border-radius:14px;background:var(--panel)} #cy.big{height:calc(100vh - 250px);min-height:380px}
/* reader */
#reader{display:grid;grid-template-columns:minmax(0,1fr) 480px;min-height:0;height:100%}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);min-height:54px}
header h3{flex:1;margin:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob{display:none}
#tools{padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap}
#tools input{max-width:210px} #tools button{padding:.3em .7em}
#doc{flex:1;overflow:auto;background:var(--pdf);padding:12px}
.page{position:relative;margin:0 auto 12px;background:#fff;box-shadow:0 1px 6px #0003}
.page canvas{display:block}
article{max-width:740px;margin:8px auto 60px;padding:34px 40px 60px;background:var(--panel);border-radius:16px;box-shadow:var(--sh);font:calc(19px*var(--z,1))/1.65 Newsreader,Georgia,serif;overflow-wrap:break-word}
article h1{font-size:1.9em} article h2{font-size:1.4em;margin-top:1.4em} article h3{font-size:1.2em;margin-top:1.2em}
article img,article svg,article video{max-width:100%;height:auto;border-radius:8px} article figure{margin:1em 0} article figcaption{font-size:.8em;color:var(--muted)}
article pre{overflow:auto;background:var(--bg);padding:12px;border-radius:8px;font-size:.78em;line-height:1.5} article table{border-collapse:collapse;font-size:.85em;display:block;overflow:auto} article td,article th{border:1px solid var(--line);padding:4px 8px}
.blk{scroll-margin:38vh;border-radius:6px} .blk.hit{background:#ff7a0030} .blk.flash{animation:fl 1.8s}
@keyframes fl{0%,60%{background:var(--acc-bg);box-shadow:0 0 0 6px var(--acc-bg)}}
.vid{max-width:860px;margin:0 auto}
#yt{position:sticky;top:-12px;z-index:4;background:var(--pdf);padding:12px 0 10px}
#yt iframe,#player{width:100%;height:auto;aspect-ratio:16/9;max-height:48vh;border:0;border-radius:14px;display:block;background:#000}
.seg{display:flex;gap:12px;padding:7px 10px;font-size:calc(15.5px*var(--z,1));line-height:1.6} .seg.now{background:var(--acc-bg)}
.ts{user-select:none;font:600 12px/2.1 "Schibsted Grotesk",system-ui;color:var(--acc);min-width:46px;text-decoration:none;flex:none}
.pad{padding:18px}
::highlight(c1){background:#ffd60070} ::highlight(c2){background:#6fdc8c80} ::highlight(c3){background:#ff8fb180}
::highlight(ul){text-decoration:underline;text-decoration-color:#e0531a;text-decoration-thickness:2.5px}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none;padding:8px 10px;align-items:center}
#tabs button{border:0;border-radius:99px;background:none;padding:.35em .5em;font-size:13.5px;min-height:34px;display:flex;gap:5px;align-items:center;color:var(--muted)}
#tabs button.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
#tabs i{font:700 11px "Schibsted Grotesk",system-ui;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted)}
#tabs .on i{background:var(--acc);color:#fff} #tabs .done i{background:var(--ok);color:#fff}
#body{flex:1;overflow:auto;padding:14px;background:var(--bg)}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;background:var(--panel);box-shadow:var(--sh)}
.box.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.box h4{margin:0 0 .3em;font-size:15.5px}
.k{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700;background:var(--acc-bg);border-radius:6px;padding:2px 8px;margin:1.3em 0 .4em}
.badge{font:700 12px "Schibsted Grotesk",system-ui;color:var(--ok);float:right}
.q{font:600 19px/1.4 Newsreader,Georgia,serif}
.msg{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.msg.user{background:var(--acc-bg);border-color:transparent;margin-left:15%}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc-bg);color:var(--acc);font:700 12px "Schibsted Grotesk",system-ui;margin-right:6px;vertical-align:2px}
.done .num{background:var(--ok);color:#fff}
progress{width:100%;height:6px;accent-color:var(--ok)}
.warn{color:#b58900;font-size:12.5px}
.textLayer span.hl{background:#ffd60070;cursor:pointer} .textLayer span.hit{background:#ff7a0080}
.textLayer span.c2{background:#6fdc8c80} .textLayer span.c3{background:#ff8fb180}
.textLayer span.ul{background:none;box-shadow:inset 0 -2.5px 0 #e0531a;cursor:pointer}
.dot{width:22px;height:22px;min-height:0!important;padding:0;border-radius:50%!important;margin:6px 4px;border:2px solid #fff8!important}
.dot.c1{background:#ffd600!important} .dot.c2{background:#6fdc8c!important} .dot.c3{background:#ff8fb1!important}
.note.c1{border-left:4px solid #ffd600} .note.c2{border-left:4px solid #6fdc8c} .note.c3{border-left:4px solid #ff8fb1} .note.ul{border-left:4px solid #e0531a}
.mbar{margin:6px 0;font-size:13px} .mbar summary{cursor:pointer;color:var(--acc)}
.mbar button{min-height:30px;padding:.1em .55em;margin:4px 4px 0 0}
.mprev:not(:empty){border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.mprev:not(:empty)::before{content:"Preview";display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
details.cardrow summary{cursor:pointer;font-weight:600;list-style-position:outside;margin-left:1em}
body.snip .page{cursor:crosshair;touch-action:none} body.snip .textLayer{pointer-events:none} body.snip #snipBtn{background:var(--acc);color:#fff}
#snipbox{position:absolute;border:2px dashed var(--acc);background:#b4460f22;pointer-events:none;z-index:5}
#sel{position:fixed;z-index:20;display:none;background:#221f1a;border-radius:12px;padding:4px;gap:2px;box-shadow:0 4px 16px #0005;animation:pop .16s var(--e)}

}
async function addWeb(html, url) {

  const art = new Readability(doc).parse();

  const root = new DOMParser().parseFromString(DOMPurify.sanitize(art.content, PURE), 'text/html').body;
  const pp = blocks(root).map(el => ({ body: el.textContent.replace(/\s+/g, ' ').trim(), html: el.outerHTML })).filter(x => x.body || /<img/i.test(x.html));
  await create('web', art.title || hostOf(url), { url, titled: true, meta: { authors: art.byline ? [art.byline.replace(/^by\s+/i, '').trim()] : [], year: (art.publishedTime || '').slice(0, 4), venue: art.siteName || hostOf(url) } }, pp);

async function addLink(v, extra, pdfOnly) {
  v = v.trim();
  const vid = v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)?.[1];
  const doi = v.match(/^(?:doi:\s*|https?:\/\/(?:dx\.)?doi\.org\/)?(10\.\d{4,9}\/\S+)$/i)?.[1];
  const ax = doi ? doi.match(/^10\.48550\/arxiv\.(.+)$/i)?.[1] : /^https?:/.test(v) && !/arxiv\.org/.test(v) ? null : v.match(ARXIV)?.[0];
  const url = vid ? 'https://www.youtube.com/watch?v=' + vid : ax ? 'https://arxiv.org/pdf/' + ax : doi ? 'https://doi.org/' + doi : /^https?:\/\/\S+$/.test(v) ? v : null;
  if (!url) throw new Error('That is not a link, an arXiv ID or a DOI. Paste one of those.');
  const dup = lib.find(p => p.url === url || (ax && p.arxiv === ax));
  if (dup) { toast('Already in your library.'); return openItem(dup.id); }
  if (vid) return addVideo(vid);
  const r = await fetch('/api/fetch?url=' + encodeURIComponent(url));
  if (!r.ok) throw new Error((await r.json()).error);
  if (r.headers.get('content-type').includes('pdf')) return addPdf(await r.arrayBuffer(), ax ? 'arXiv ' + ax : decodeURIComponent(url.split('/').pop()), { url, ...(ax && { arxiv: ax.replace(/v\d+$/, '') }), ...extra });

}
// ---------- following blogs and journals (RSS / Atom) ----------
function parseFeed(xml) {

    title: tx(e, 'title'), link: e.querySelector('link[href]:not([rel]), link[rel=alternate]')?.getAttribute('href') || tx(e, 'link'),

  const known = [...new Set(lib.filter(x => x !== p).flatMap(x => x.concepts.map(c => c.name)))].slice(0, 150);

// ---------- reader: PDF pages (lazy, selectable text layer) ----------
async function renderPdf(buf) {
  const box = $('#doc'); box.innerHTML = ''; io?.disconnect();
  const doc = pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
  const first = await doc.getPage(1);
  const scale = Math.min(box.clientWidth - 44, 900) * zoom / first.getViewport({ scale: 1 }).width;
  const vp = first.getViewport({ scale });
  io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && drawPage(doc, e.target, scale)), { root: box, rootMargin: '800px' });
  for (let n = 1; n <= doc.numPages; n++) {
    const d = document.createElement('div'); d.className = 'page'; d.dataset.n = n;
    d.style.cssText = `width:${vp.width}px;height:${vp.height}px;--scale-factor:${scale}`;

  }
}

const dayKey = t => new Date(t).toDateString();
function streak() {
  const days = new Set(activity.map(dayKey)); let n = 0, t = Date.now();
  if (!days.has(dayKey(t))) t -= 864e5; // today doesn't break a streak until it's over
  while (days.has(dayKey(t))) { n++; t -= 864e5; }
  return n;
}
function heat() {
  const c = {}; for (const t of activity) c[dayKey(t)] = (c[dayKey(t)] || 0) + 1;
  return `<div class="heat">` + Array.from({ length: 84 }, (_, i) => {
    const d = Date.now() - (83 - i) * 864e5, n = c[dayKey(d)] || 0;
    return `<i style="--a:${n ? Math.min(1, .3 + n / 12) : 0}" title="${esc(new Date(d).toLocaleDateString())}: ${n} study step${n === 1 ? '' : 's'}"></i>`;
  }).join('') + `</div>`;
}

// One-time move from the old version, which kept everything in this browser's IndexedDB. The old data is left untouched.
async function migrate() {

  const d = await new Promise((ok, no) => { const r = indexedDB.open('marrow'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  if (!d.objectStoreNames.contains('papers') || !d.objectStoreNames.contains('pdfs')) return;
  const all = (s, m) => new Promise((ok, no) => { const q = d.transaction(s).objectStore(s)[m](); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); });

  const T = olds.map(o => ({ o, text: norm((o.pages || []).join(' ')), key: norm(o.title).slice(0, 40) })); // citation links used to be found on the fly

    run('Drafting a synthesis — about a minute…', async () => {
      const body = await ai([{ role: 'system', content: `You help a researcher write a literature review. From the summaries below (and the researcher's own takes, where given), write a synthesis in Markdown with these sections: ## Themes, ## Where the sources agree, ## Where they disagree or differ in method, ## Gaps and open questions, ## Suggested reading order. Refer to each source as (First author's surname, Year) or by a short title. Compare and connect; do not summarize the sources one by one. Use only what the summaries say and never invent findings, numbers or citations. If the sources are unrelated, say so plainly.` },
        { role: 'user', content: ps.map(p => `SOURCE: "${p.title}" — ${byline(p)}\nProblem: ${p.brief.problem}\nIdea: ${p.brief.idea}\nMethod: ${p.brief.method}\nFindings: ${p.brief.results}\nLimitations: ${p.brief.limitations}` + (p.take ? `\nResearcher's take: ${p.take}` : '')).join('\n\n') }]);
      const n = { id: crypto.randomUUID(), title: `Synthesis: ${F.project || 'whole library'}`, project: F.project, note: body + `\n\n---\nDrafted by AI from ${ps.length} briefings. Check every claim against the sources before you build on it.`, updated: Date.now() };
      notes.unshift(n); await saveNote(n); N = n.id; go('notebook');
    }, null);
  },
  // notebook
  nbnew: () => { const n = { id: crypto.randomUUID(), title: '', project: F.project, note: '', updated: Date.now() }; notes.unshift(n); N = n.id; saveNote(n); render(); $('.ttl')?.focus(); },
  nbopen: el => { saveNote(curNote()); N = el.dataset.id; render(); },
  nbdel: async () => {
    const n = curNote(); if (!n || !confirm(`Delete “${n.title || 'Untitled'}”? This cannot be undone.`)) return;
    clearTimeout(nbT); await api('notes/' + n.id, { method: 'DELETE' }).catch(e => toast(e.message));
    notes = notes.filter(x => x !== n); N = null; render();
  },
  nbexport: () => { const n = curNote(); dl(fname(n.title || 'note') + '.md', `# ${n.title}\n\n${n.note}`, 'text/markdown'); },
};
// What typing into a field with data-k changes. Kept in the model so re-renders never lose text.
const SET = {
  sec: (v, d) => P.sections[d.i].answer = v,
  note: (v, d) => P.notes[d.i].note = v,
  teach: v => (P.feynman ||= {}).text = v,
  tags: v => P.tags = [...new Set(v.split(',').map(t => t.trim().toLowerCase()).filter(Boolean))],
  project: v => P.project = v.trim(),
  take: (v, d) => byId(d.id).take = v,
  nbtitle: v => curNote().title = v,
  nbproject: v => curNote().project = v.trim(),
  nbnote: v => { curNote().note = v; $('#nbprev').innerHTML = md(v, null); window.renderMathInElement?.($('#nbprev'), MATH); },
};
const FORM = {
  ask: f => ask(f.q.value),
  add: async f => {
    const v = f.u.value.trim(), b = f.querySelector('button'); if (!v) return;
    b.disabled = true; toast('Fetching that link…');
    try { await addLink(v); } catch (e) { toast(e.message); }
    b.disabled = false;
  },
  disc: f => discover(f.q.value.trim()),
  follow: async f => {
    const v = f.u.value.trim(), b = f.querySelector('button'); b.disabled = true; toast('Looking for the feed…');
    try {
      const g = await getFeed(/^https?:\/\//.test(v) ? v : 'https://' + v);
      if (!feeds.some(x => x.url === g.url)) { await send('PUT', 'feeds', { url: g.url, title: g.title }); feeds.push({ url: g.url, title: g.title }); }
      news = [...(news || []).filter(x => x.src !== g.url), ...g.items].sort((a, b) => b.date - a.date).slice(0, 40);
      toast(`Following ${g.title}.`); render();
    } catch (e) { toast('Could not follow that: ' + e.message); b.disabled = false; }
  },
  paste: f => {
    const pp = parseTranscript(f.t.value);
    if (pp.map(x => x.body).join('').length < 200) return toast("That doesn't look like a full transcript yet.");
    P.parts = pp; P.pages = pp.map(x => x.body); P.times = pp.map(x => x.t); // times stay on the item so citations show timestamps before the transcript is loaded
    save(P, pp); render(); renderBlocks(); analyze();
  },
};
function onClick(e) {
  const el = e.target.closest?.('[data-act],[data-page],[data-open],[data-view],[data-ins]'); if (!el) return;
  const d = el.dataset;
  if (d.ins) return insertMath(el);
  if (d.act) { if (/INPUT|SELECT/.test(el.tagName) && e.type !== 'change') return; if (el.tagName === 'A') e.preventDefault(); return ACT[d.act](el); }
  e.preventDefault();
  if (d.view) return go(d.view);
  if (d.open) return openItem(d.open, +d.n || 0);
  if (view !== 'read' || (d.pid && d.pid !== P.id)) return openItem(d.pid || P.id, +d.page);
  gotoPage(+d.page);
}
document.addEventListener('click', onClick);
// Fields save when you leave them. Nothing is re-rendered here: that would swallow the click that caused the blur.
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.act) return onClick(e);
  if (d.k === 'take') save(byId(d.id));
  else if (d.k?.startsWith('nb')) { clearTimeout(nbT); saveNote(curNote()); renderRail(); }
  else if (d.k && P) { save(P); renderRail(); }
});
document.addEventListener('input', e => {
  const t = e.target, v = t.value;
  if (t.id === 'q') { F.q = v; libRows(); clearTimeout(ftT); ftT = setTimeout(ftSearch, 300); return; }
  const pv = (t.closest('form') || t).nextElementSibling?.nextElementSibling;
  if (pv?.classList.contains('mprev')) { pv.innerHTML = /\$|\\\(/.test(v) ? md(v) : ''; window.renderMathInElement?.(pv, MATH); }
  SET[t.dataset.k]?.(v, t.dataset);
  if (t.dataset.k?.startsWith('nb')) { curNote().updated = Date.now(); clearTimeout(nbT); nbT = setTimeout(() => saveNote(curNote()), 1500); }
});
document.addEventListener('submit', e => { const f = e.target.dataset.f; if (f) { e.preventDefault(); FORM[f](e.target); } });
$('#resFile').onchange = e => e.target.files[0] && restore(e.target.files[0]).catch(err => toast('Not a valid Marrow backup: ' + err.message));
$('#file').onchange = e => addFiles(e.target.files);
document.ondragover = e => e.preventDefault();
document.ondrop = e => { e.preventDefault(); addFiles(e.dataTransfer.files); };

// ---------- reader tools: find, zoom, figure snip, timestamped notes ----------
$('#find').onkeydown = e => {
  if (e.key !== 'Enter' || !P) return;
  const q = e.target.value.trim().toLowerCase();
  if (q !== findQ) { findQ = q; findI = 0; findHits = q ? P.pages.flatMap((t, i) => t.toLowerCase().includes(q) ? [i + 1] : []) : []; paintAll(); }
  else findI = (findI + 1) % Math.max(1, findHits.length);
  $('#findn').textContent = !q ? '' : findHits.length ? `${loc(P, findHits[findI])} · ${findI + 1}/${findHits.length}` : 'no matches';
  if (findHits.length) gotoPage(findHits[findI]);
};
$('#zi').onclick = () => rezoom(1.2);
$('#zo').onclick = () => rezoom(1 / 1.2);
$('#tnote').onclick = () => { P.notes.unshift({ page: nowPart() || undefined, note: '' }); save(P); tab = 'notes'; document.body.classList.add('study'); render(); $('#body textarea')?.focus(); };
$('#snipBtn').onclick = () => document.body.classList.toggle('snip') && toast('Drag a box around a figure, table or equation.');
$('#viewBtn').onclick = () => document.body.classList.toggle('study');
$('#doc').onscroll = e => { const d = e.target; $('#prog i').style.width = Math.min(100, d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight) * 100) + '%'; }; // how far through the source you are
$('#doc').onclick = e => { if (e.target.closest('.hl,.ul') && !getSelection().toString()) { tab = 'notes'; document.body.classList.add('study'); render(); } };
$('#doc').onpointerdown = e => {
  const d = e.target.closest('.page'); if (!d || !document.body.classList.contains('snip')) return;
  e.preventDefault(); const r = d.getBoundingClientRect(), box = document.createElement('div');
  box.id = 'snipbox'; d.append(box); try { d.setPointerCapture(e.pointerId); } catch {}
  snip = { d, box, x: e.clientX - r.left, y: e.clientY - r.top };
};
$('#doc').onpointermove = e => {
  if (!snip) return;
  const r = snip.d.getBoundingClientRect(); snip.x2 = e.clientX - r.left; snip.y2 = e.clientY - r.top;
  snip.box.style.cssText = `left:${Math.min(snip.x, snip.x2)}px;top:${Math.min(snip.y, snip.y2)}px;width:${Math.abs(snip.x2 - snip.x)}px;height:${Math.abs(snip.y2 - snip.y)}px`;
};
$('#doc').onpointerup = () => {
  if (!snip) return;
  const { d, box, x, y, x2, y2 } = snip, c = d.querySelector('canvas'), w = Math.abs(x2 - x), h = Math.abs(y2 - y);
  snip = null; box.remove(); document.body.classList.remove('snip');
  if (!c || !(w > 20 && h > 20)) return;
  const k = c.width / d.clientWidth, o = document.createElement('canvas'); o.width = w * k; o.height = h * k;
  o.getContext('2d').drawImage(c, Math.min(x, x2) * k, Math.min(y, y2) * k, w * k, h * k, 0, 0, w * k, h * k);
  ask(`Explain this figure, table or equation from p.${d.dataset.n}: what it shows, how to read it, and why it matters for the argument.`, o.toDataURL('image/jpeg', .85));
};

// ---------- selection toolbar ----------
let picked = null, selT;
document.addEventListener('selectionchange', () => {
  clearTimeout(selT);
  selT = setTimeout(() => {
    const s = getSelection(), str = s.toString().replace(/\s+/g, ' ').trim(), bar = $('#sel');
    const rg = s.rangeCount ? s.getRangeAt(0) : null, page = s.anchorNode?.parentElement?.closest('.page'), b0 = blkOf(rg?.startContainer);
    if (view !== 'read' || (!page && !b0) || str.length < 3) return bar.style.display = 'none';
    if (page) { const idx = spansOf(page).flatMap((x, i) => rg.intersectsNode(x) ? [i] : []); picked = { text: str.slice(0, 2000), page: +page.dataset.n, a: idx[0], b: idx.at(-1) }; }
    else {
      const b1 = blkOf(rg.endContainer); // a selection that runs out of the text ends with its first block
      picked = { text: str.slice(0, 2000), page: +b0.dataset.n, a: offIn(b0, rg.startContainer, rg.startOffset), eb: +(b1 || b0).dataset.n, b: b1 ? offIn(b1, rg.endContainer, rg.endOffset) : b0.textContent.length };
    }
    const r = rg.getBoundingClientRect();
    bar.style.display = 'flex';
    bar.style.top = Math.max(8, r.top - 48) + 'px'; bar.style.left = Math.max(8, Math.min(innerWidth - bar.offsetWidth - 8, r.left)) + 'px';
  }, 250);
});
$('#sel').onclick = e => {
  const btn = e.target.closest('button'), k = btn?.dataset.s, { text: quote, ...at } = picked; if (!k) return;
  getSelection().removeAllRanges();
  const mark = (extra, open) => {
    P.notes.unshift({ quote, ...at, note: '', ...extra }); save(P); paintAll();
    if (open) { tab = 'notes'; document.body.classList.add('study'); render(); $('#body textarea')?.focus(); }
    else { if (tab === 'notes') render(); toast('Saved to this source’s Notes.'); }
  };
  if (k === 'hl') mark({ c: +btn.dataset.c });
  if (k === 'ul') mark({ ul: 1 });
  if (k === 'note') mark({ c: 1 }, true);
  if (k === 'explain') ask(`Explain this passage from p.${at.page} in plain language, with the intuition behind it:\n"${quote}"`);
  if (k === 'card') run('Writing a flashcard…', async p => {
    const j = await aiJSON('Turn the passage into one flashcard that tests the underlying idea. JSON: {"q":"","a":"short answer"}', quote);
    p.cards.push({ q: j.q, a: j.a }); toast('Card added: ' + j.q);
  });
};

// ---------- boot ----------
try {
  ({ items: lib, notes, activity, feeds = [] } = await api('library'));
  await migrate().catch(e => toast('Could not move your old in-browser library over: ' + e.message + '. It is still safe in this browser.'));
} catch (e) { toast('Could not reach the Marrow server (' + e.message + '). Check that it is still running, then reload this page.'); }
enter($('#page')); render();
</script>
</body>
</html>
